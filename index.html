<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Καταστήματα & εγκαταστάσεις</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --surface-2:#F7F8F6; --ink:#18212B; --muted:#5B6570; --line:#D8DCD6;
  --accent:#A92A1F; --accent-soft:#F5E2DF; --ok:#2C7A4B; --future:#9A5D08; --focus:#1F5FBF;
  --row-hover:#F4F6F3; --radius-s:4px; --radius-m:8px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --surface:#182029; --surface-2:#1D262F; --ink:#E7EBEE; --muted:#9BA5AF; --line:#2B3540;
    --accent:#E46B5E; --accent-soft:#3A2220; --ok:#62C08A; --future:#E2A84F; --focus:#7FA8F0; --row-hover:#1E2832;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#182029; --surface-2:#1D262F; --ink:#E7EBEE; --muted:#9BA5AF; --line:#2B3540;
  --accent:#E46B5E; --accent-soft:#3A2220; --ok:#62C08A; --future:#E2A84F; --focus:#7FA8F0; --row-hover:#1E2832;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Commissioner,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto;padding:28px 20px 56px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:22px}
h1{margin:0;font-size:clamp(24px,3.2vw,32px);font-weight:650;letter-spacing:-.015em;line-height:1.15}
.sub{margin:6px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.link{border:0;background:none;padding:6px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* tabs */
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{background:none;border:0;padding:10px 0 12px;cursor:pointer;font-size:17px;font-weight:550;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-variant-numeric:tabular-nums;font-weight:450;margin-left:6px}

/* composition bar */
.mix{margin-bottom:18px}
.mix-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.mix-head h2{margin:0;font-size:15px;font-weight:600}
.bar{display:flex;height:38px;border-radius:var(--radius-s);overflow:hidden;background:var(--line);gap:2px}
.seg{flex:var(--n) 1 0;min-width:4px;border:0;padding:0 8px;background:var(--c);color:#fff;cursor:pointer;text-align:left;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:clip;transition:opacity .15s,filter .15s}
.seg:hover{filter:brightness(1.08)}
.seg.dim{opacity:.22}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0;padding:0;list-style:none}
.legend button{background:none;border:0;padding:4px 2px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:14px;border-radius:var(--radius-s)}
.legend .sw{width:11px;height:11px;border-radius:2px;background:var(--c)}
.legend .n{color:var(--muted);font-variant-numeric:tabular-nums}
.legend button.dim{opacity:.45}
.legend button[aria-pressed="true"]{font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--c);text-decoration-thickness:2px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:10px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-s);padding:0 10px;background:var(--surface-2)}
.search input{border:0;background:none;padding:9px 0;width:100%;outline:none}
.search:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.search svg{flex:none;color:var(--muted)}
details.facet{position:relative}
details.facet>summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 12px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);white-space:nowrap;user-select:none}
details.facet>summary::-webkit-details-marker{display:none}
details.facet>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:4px;opacity:.6}
details.facet[open]>summary{border-color:var(--ink)}
details.facet.active>summary{border-color:var(--accent);background:var(--accent-soft)}
.badge{background:var(--accent);color:#fff;border-radius:10px;font-size:12px;font-weight:600;padding:0 7px;line-height:18px}
.menu{position:absolute;z-index:20;top:calc(100% + 6px);left:0;min-width:260px;max-width:min(380px,86vw);max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:0 10px 30px rgba(15,25,35,.16);padding:6px}
.menu label{display:flex;align-items:flex-start;gap:9px;padding:6px 8px;border-radius:var(--radius-s);cursor:pointer;font-size:14px}
.menu label:hover{background:var(--row-hover)}
.menu label.zero{color:var(--muted)}
.menu input{margin-top:3px;accent-color:var(--accent)}
.menu .lbl{flex:1}
.menu .n{color:var(--muted);font-variant-numeric:tabular-nums}
.menu .empty-val{font-style:italic}
.menu-foot{display:flex;justify-content:flex-end;border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.range{display:flex;gap:8px;padding:8px;align-items:center}
.range input{width:110px;border:1px solid var(--line);border-radius:var(--radius-s);padding:7px 8px;background:var(--surface-2)}
.sortsel{max-width:100%;border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 10px;background:var(--surface)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 6px 3px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip .x{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-2);font-size:13px;line-height:1}

.summary{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:baseline;margin:16px 2px 10px}
.summary strong{font-variant-numeric:tabular-nums}
.note summary{cursor:pointer;color:var(--muted);font-size:14px}
.note pre{white-space:pre-wrap;font:inherit;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:12px 14px;margin:8px 0 0;max-width:80ch}

/* table */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;border-bottom:1px solid var(--line);padding:0;white-space:nowrap;z-index:2}
th button{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:10px 12px;width:100%;box-sizing:border-box}
th button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
th.num button{justify-content:flex-end}
th .arrow{width:10px;color:var(--accent);font-size:11px}
th[aria-sort="none"] .arrow{color:var(--muted);opacity:.35}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--row-hover)}
tr.row.open td{background:var(--row-hover);border-bottom-color:transparent}
td.code{font-weight:600;font-variant-numeric:tabular-nums;min-width:4.5em;max-width:10em;overflow-wrap:anywhere}
td.code:not(:has(*)){white-space:normal}
td.name .nm{all:unset;cursor:pointer;font-weight:600}
td.name .nm:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
td .second{display:block;color:var(--muted);font-size:13px}
.tag{display:inline-block;white-space:nowrap;font-size:12.5px;font-weight:600;padding:1px 8px 1px 7px;border-left:4px solid var(--c);background:var(--surface-2);border-radius:2px}
.status{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok::before{background:var(--ok)}
.status.future{color:var(--future)}
.status.future::before{background:transparent;border:2px solid var(--future);width:6px;height:6px}
.blank{color:var(--muted);opacity:.7}
tr.detail td{background:var(--row-hover);padding:4px 12px 18px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 28px;padding-left:2px}
.dgrid dt{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.dgrid dd{margin:0;white-space:pre-line;max-width:60ch}
.dgrid a{color:var(--accent);text-underline-offset:2px;word-break:break-all}
.empty{padding:48px 20px;text-align:center}
.empty p{margin:0 0 10px}

.banner{border:1px solid var(--line);border-left:4px solid var(--ok);background:var(--surface);border-radius:var(--radius-s);padding:10px 14px;margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.banner.err{border-left-color:var(--accent)}
.drop{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 85%,transparent);border:3px dashed var(--accent);font-size:20px;font-weight:600}
.drop.on{display:grid}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .wrap{padding:20px 14px 40px}
  thead{display:none}
  table,tbody,tr,td{display:block}
  tr.row{display:grid;grid-template-columns:auto 1fr;column-gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  tr.row td{border:0;padding:3px 0;background:none!important}
  tr.row td.code{grid-row:1;grid-column:1}
  tr.row td.name{grid-row:1;grid-column:2}
  tr.row td:not(.code):not(.name){grid-column:1 / -1;display:flex;gap:10px}
  tr.row td:not(.code):not(.name)::before{content:attr(data-label);color:var(--muted);font-size:12.5px;min-width:96px;flex:none;padding-top:1px}
  tr.row td.num{text-align:left}
  tr.row td.chev{display:none}
  tr.row.open{background:var(--row-hover)}
  tr.detail td{padding:0 14px 16px;border-bottom:1px solid var(--line)}
  .menu{left:auto;right:auto}
  .mix-head .muted{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Καταστήματα & εγκαταστάσεις</h1>
      <p class="sub" id="source">Δεδομένα από το stores.json</p>
    </div>
    <div>
      <label class="btn" for="file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
        Φόρτωση νέου JSON
      </label>
      <input type="file" id="file" accept=".json,application/json" class="sr">
    </div>
  </header>

  <div id="banner"></div>

  <div class="tabs" role="tablist" id="tabs"></div>

  <section class="mix" id="mix" aria-label="Κατανομή ανά τύπο"></section>

  <div class="toolbar" id="toolbar">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">Αναζήτηση</span>
      <input id="q" type="search" placeholder="Κωδικός, ονομασία, διεύθυνση, ΤΚ, πόλη ή email" autocomplete="off">
    </label>
    <span id="facets" style="display:contents"></span>
    <details class="facet" id="areaFacet">
      <summary>Επιφάνεια</summary>
      <div class="menu">
        <div class="range">
          <input id="amin" type="number" min="0" inputmode="numeric" placeholder="Από τ.μ." aria-label="Ελάχιστη επιφάνεια">
          <span class="muted">έως</span>
          <input id="amax" type="number" min="0" inputmode="numeric" placeholder="Έως τ.μ." aria-label="Μέγιστη επιφάνεια">
        </div>
        <label><input type="checkbox" id="anull"><span class="lbl">Μόνο χωρίς καταχωρημένη επιφάνεια</span></label>
      </div>
    </details>
    <label class="sr" for="sortsel">Ταξινόμηση</label>
    <select id="sortsel" class="sortsel"></select>
  </div>
  <div class="chips" id="chips"></div>

  <div class="summary">
    <div id="count" aria-live="polite"></div>
    <details class="note" id="note"></details>
  </div>

  <div class="table-wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

    facets:[["type","Κατηγορία"],["status","Κατάσταση"],["geo","Γεωγρ. περιφέρεια"],["network","Δίκτυο"],["loctype","Τύπος τοποθεσίας"],["owner","Ιδιοκτησία"]]
  }
};
// Spelling variants of the same store type are merged so filters don't split them.
const TYPE_ALIASES = {"SELF SERVICE":"SELF-SERVICE","FOOD TO GO":"FTG"};

const COLUMNS = [
  {key:"code",label:"Κωδικός",cls:"code"},
  {key:"name",label:"Ονομασία",cls:"name"},
  {key:"type",label:null},
  {key:"city",label:"Τοποθεσία"},
  {key:"geo",label:"Γεωγρ. περιφέρεια"},
  {key:"network",label:"Δίκτυο"},
  {key:"status",label:"Κατάσταση"},
  {key:"owner",label:"Ιδιοκτησία"},
  {key:"area",label:"Επιφάνεια (τ.μ.)",cls:"num"}
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const clean = v => (v==null?"":String(v)).replace(/\s+$/,"").replace(/^\s+/,"");

function parseArea(s){
  const m = clean(s).match(/\d[\d.]*(,\d*)?/);
  if(!m) return null;
  const n = parseFloat(m[0].replace(/\./g,"").replace(",","."));
  return isFinite(n) ? n : null;
}

function buildDataset(kind, rows){
  const sc = SCHEMAS[kind];
  if(!Array.isArray(rows) || !rows.length || !Array.isArray(rows[0])) return null;
  const header = rows[0].map(h=>clean(h).toLowerCase());
  const idx = {};
  for(const [k,names] of Object.entries(sc.fields)){
    idx[k] = -1;
    for(const n of names){ const i = header.indexOf(n.toLowerCase()); if(i>=0){ idx[k]=i; break; } }
  }
  const has = k => idx[k] >= 0;
  let updateNote = "";
  const items = [];
  rows.slice(1).forEach((r,i)=>{
    if(!Array.isArray(r)) return;
    const g = k => has(k) ? clean(r[idx[k]]) : "";
    if(!updateNote && g("update")) updateNote = g("update");
    if(!g("code") && !g("name")) return;
    let type = g("type"); type = TYPE_ALIASES[type.toUpperCase()] || type;
    const it = {
      id: kind+":"+i, code:g("code"), name:g("name"), type, address:g("address"), tk:g("tk"), city:g("city"),
      geo:g("geo"), network:g("network"), region:g("region"), status:g("status"), loctype:g("loctype"),
      owner:g("owner"), areaRaw:g("area"), area:parseArea(g("area")), desc:g("desc"),
      emails: g("email").split(/[\s,;]+/).filter(e=>e.includes("@"))
    };
    it.hay = fold([it.code,it.name,it.address,it.tk,it.tk.replace(/\s/g,""),it.city,it.region,it.network,it.desc,it.emails.join(" ")].join(" | "));
    items.push(it);
  });
  const facets = sc.facets.filter(([k])=>has(k));
  const typeValues = [...new Set(items.map(i=>i.type||EMPTY))]
    .sort((a,b)=>items.filter(i=>(i.type||EMPTY)===b).length - items.filter(i=>(i.type||EMPTY)===a).length);
  const colors = {}; typeValues.forEach((t,i)=>colors[t] = t===EMPTY ? "#8C949B" : PALETTE[i % PALETTE.length]);
  return {kind, sc, items, facets, has, colors, updateNote};
}

const state = {tab:"stores", data:{}, view:{}};
function freshView(){ return {q:"", sel:{}, amin:"", amax:"", anull:false, sort:{key:"name",dir:1}, open:new Set()}; }

function load(json, sourceLabel){
  const items = json && json.items;
  if(!items || (!items.stores && !items.facilities)) throw new Error("Το αρχείο δεν περιέχει items.stores ή items.facilities.");
  const data = {};
  for(const k of ["stores","facilities"]){
    if(items[k]){ const d = buildDataset(k, items[k]); if(d) data[k]=d; }
  }
  if(!Object.keys(data).length) throw new Error("Οι πίνακες δεν έχουν την αναμενόμενη μορφή (πρώτη γραμμή επικεφαλίδες, μετά γραμμές τιμών).");
  state.data = data;
  state.view = {}; for(const k of Object.keys(data)) state.view[k] = freshView();
  if(!data[state.tab]) state.tab = Object.keys(data)[0];
  $("source").textContent = "Δεδομένα από το " + sourceLabel;
  renderAll();
}

/* ---------- filtering ---------- */
const D = () => state.data[state.tab];
const V = () => state.view[state.tab];
const val = (it,k) => it[k] || EMPTY;

function passes(it, v, except){
  for(const [k,set] of Object.entries(v.sel)){
    if(k===except || !set.size) continue;
    if(!set.has(val(it,k))) return false;
  }
  if(except!=="area"){
    if(v.anull){ if(it.area!=null) return false; }
    else{
      const mn = v.amin===""?null:+v.amin, mx = v.amax===""?null:+v.amax;
      if(mn!=null && (it.area==null || it.area<mn)) return false;
      if(mx!=null && (it.area==null || it.area>mx)) return false;
    }
  }
  if(v.q){
    const terms = fold(v.q).split(/\s+/).filter(Boolean);
    for(const t of terms) if(!it.hay.includes(t)) return false;
  }
  return true;
}
function counts(key){
  const d=D(), v=V(), m=new Map();
  for(const it of d.items){ if(passes(it,v,key)){ const x=val(it,key); m.set(x,(m.get(x)||0)+1); } }
  return m;
}
function allValues(key){
  const s=new Set(D().items.map(it=>val(it,key)));
  return [...s].sort((a,b)=> a===EMPTY?1 : b===EMPTY?-1 : coll.compare(a,b));
}
function sortItems(list){
  const {key,dir}=V().sort;
  const get = it => key==="area" ? it.area : (key==="city" ? (it.city||"") : (it[key]||""));
  return list.slice().sort((a,b)=>{
    const x=get(a), y=get(b);
    const ex = x===null||x==="", ey = y===null||y==="";
    if(ex&&ey) return coll.compare(a.name,b.name);
    if(ex) return 1; if(ey) return -1;
    const c = key==="area" ? x-y : coll.compare(x,y);
    return c ? c*dir : coll.compare(a.name,b.name);
  });
}

/* ---------- rendering ---------- */
function renderAll(){ renderTabs(); renderFacetShells(); renderSortSelect(); syncInputs(); render(); }

function renderTabs(){
  $("tabs").innerHTML = Object.values(state.data).map(d=>
    `<button class="tab" role="tab" data-tab="${d.kind}" aria-selected="${d.kind===state.tab}">${esc(d.sc.label)}<span class="count">${d.items.length}</span></button>`
  ).join("");
}
function renderFacetShells(){
  $("facets").innerHTML = D().facets.map(([k,label])=>
    `<details class="facet" data-key="${k}"><summary>${esc(label)}<span class="b"></span></summary><div class="menu"><div class="list"></div><div class="menu-foot"><button class="btn link" data-clear="${k}" type="button">Καθαρισμός</button></div></div></details>`
  ).join("");
}
function renderSortSelect(){
  const opts=[];
  for(const c of COLUMNS){
    const l = c.label || D().sc.typeLabel;
    if(c.key==="area"){ opts.push(["area:-1",l+": μεγαλύτερη πρώτα"],["area:1",l+": μικρότερη πρώτα"]); }
    else opts.push([c.key+":1",l+": Α→Ω"],[c.key+":-1",l+": Ω→Α"]);
  }
  $("sortsel").innerHTML = opts.map(([v,l])=>`<option value="${v}">Ταξινόμηση: ${esc(l)}</option>`).join("");
}
function syncInputs(){
  const v=V(); $("q").value=v.q; $("amin").value=v.amin; $("amax").value=v.amax; $("anull").checked=v.anull;
}

function render(){
  const d=D(), v=V();
  const list = sortItems(d.items.filter(it=>passes(it,v)));
  renderMix(); renderFacetLists(); renderChips(); renderHead(); renderBody(list);
  $("sortsel").value = v.sort.key+":"+v.sort.dir;
  const total = list.reduce((s,it)=>s+(it.area||0),0);
  const missing = list.filter(it=>it.area==null).length;
  $("count").innerHTML = list.length===d.items.length
    ? `<strong>${list.length}</strong> ${d.sc.many}, συνολική επιφάνεια <strong>${nf.format(total)}</strong> τ.μ.` + (missing?` <span class="muted">(${missing} χωρίς επιφάνεια)</span>`:"")
    : `Εμφανίζονται <strong>${list.length}</strong> από ${d.items.length} ${d.sc.many}, συνολική επιφάνεια <strong>${nf.format(total)}</strong> τ.μ.` + (missing?` <span class="muted">(${missing} χωρίς επιφάνεια)</span>`:"");
  const note = $("note");
  if(d.updateNote){
    const [first,...rest] = d.updateNote.split("\n");
    note.hidden=false;
    note.innerHTML = `<summary>Τελευταία ενημέρωση φύλλου: ${esc(first)}</summary>${rest.length?`<pre>${esc(rest.join("\n"))}</pre>`:""}`;
  } else note.hidden=true;
}

function renderMix(){
  const d=D(), v=V(), c=counts("type"), sel=v.sel.type||new Set();
  const vals = Object.keys(d.colors);
  const totalShown = [...c.values()].reduce((a,b)=>a+b,0);
  const isDim = t => sel.size ? !sel.has(t) : !(c.get(t));
  const lbl = t => t===EMPTY?EMPTY_LABEL:t;
  const barW = $("mix").clientWidth || 800;
  $("mix").innerHTML =
    `<div class="mix-head"><h2>${esc(d.sc.mixTitle)}</h2><span class="muted">Πατήστε έναν τύπο για φιλτράρισμα</span></div>
     <div class="bar">${totalShown ? vals.filter(t=>c.get(t)).map(t=>
       `<button class="seg ${isDim(t)?"dim":""}" style="--n:${c.get(t)};--c:${d.colors[t]}" data-type="${esc(t)}" title="${esc(lbl(t))}: ${c.get(t)}" aria-label="${esc(lbl(t))}, ${c.get(t)}" tabindex="-1">${c.get(t)/totalShown*barW > lbl(t).length*8+20?esc(lbl(t)):""}</button>`).join("") : ""}</div>
     <ul class="legend">${vals.map(t=>
       `<li><button style="--c:${d.colors[t]}" data-type="${esc(t)}" aria-pressed="${sel.has(t)}" class="${isDim(t)?"dim":""}"><span class="sw"></span>${esc(lbl(t))} <span class="n">${c.get(t)||0}</span></button></li>`).join("")}</ul>`;
}

function renderFacetLists(){
  const v=V();
  document.querySelectorAll("#facets details.facet").forEach(det=>{
    const k=det.dataset.key, c=counts(k), sel=v.sel[k]||new Set();
    const focused = document.activeElement && det.contains(document.activeElement) ? document.activeElement.value : null;
    det.querySelector(".list").innerHTML = allValues(k).map(x=>{
      const n=c.get(x)||0;
      return `<label class="${n?"":"zero"}"><input type="checkbox" value="${esc(x)}" ${sel.has(x)?"checked":""}><span class="lbl ${x===EMPTY?"empty-val":""}">${esc(x===EMPTY?EMPTY_LABEL:x)}</span><span class="n">${n}</span></label>`;
    }).join("");
    det.classList.toggle("active", sel.size>0);
    det.querySelector("summary .b").innerHTML = sel.size?`<span class="badge">${sel.size}</span>`:"";
    if(focused!=null){ const el=[...det.querySelectorAll("input")].find(i=>i.value===focused); if(el) el.focus(); }
  });
  const areaOn = v.anull || v.amin!=="" || v.amax!=="";
  $("areaFacet").classList.toggle("active", areaOn);
}

function renderChips(){
  const d=D(), v=V(), chips=[];
  const label = k => (d.facets.find(f=>f[0]===k)||[k,k])[1];
  for(const [k,set] of Object.entries(v.sel)) for(const x of set)
    chips.push(`<button class="chip" data-chip="${k}" data-val="${esc(x)}">${esc(label(k))}: ${esc(x===EMPTY?EMPTY_LABEL:x)}<span class="x" aria-hidden="true">×</span><span class="sr">Αφαίρεση</span></button>`);
  if(v.anull) chips.push(`<button class="chip" data-chip="area">Χωρίς επιφάνεια<span class="x">×</span></button>`);
  else if(v.amin!==""||v.amax!=="") chips.push(`<button class="chip" data-chip="area">Επιφάνεια ${v.amin!==""?"από "+nf.format(v.amin):""} ${v.amax!==""?"έως "+nf.format(v.amax):""} τ.μ.<span class="x">×</span></button>`);
  if(v.q) chips.push(`<button class="chip" data-chip="q">Αναζήτηση: «${esc(v.q)}»<span class="x">×</span></button>`);
  if(chips.length>1) chips.push(`<button class="btn link" data-chip="all">Καθαρισμός όλων</button>`);
  $("chips").innerHTML = chips.join("");
}

function renderHead(){
  const v=V();
  $("thead").innerHTML = "<tr>" + COLUMNS.map(c=>{
    const l = c.label || D().sc.typeLabel;
    const on = v.sort.key===c.key;
    const aria = on ? (v.sort.dir===1?"ascending":"descending") : "none";
    const arrow = on ? (v.sort.dir===1?"▲":"▼") : "▲";
    return `<th class="${c.cls||""}" aria-sort="${aria}"><button data-sort="${c.key}">${esc(l)}<span class="arrow" aria-hidden="true">${arrow}</span></button></th>`;
  }).join("") + `<th aria-label="Λεπτομέρειες"></th></tr>`;
}

const blank = `<span class="blank">—</span>`;
const txt = s => s ? esc(s) : blank;

function renderBody(list){
  const d=D(), v=V(), tl=d.sc.typeLabel;
  if(!list.length){
    $("tbody").innerHTML = `<tr><td colspan="${COLUMNS.length+1}" class="empty"><p>Κανένα αποτέλεσμα με αυτά τα φίλτρα.</p><button class="btn" data-chip="all">Καθαρισμός φίλτρων</button></td></tr>`;
    return;
  }
  $("tbody").innerHTML = list.map(it=>{
    const open = v.open.has(it.id);
    const st = it.status==="Σε λειτουργία" ? "ok" : it.status==="Μελλοντικό" ? "future" : "";
    const row = `<tr class="row ${open?"open":""}" data-id="${it.id}">
      <td class="code">${txt(it.code)}</td>
      <td class="name"><button class="nm" aria-expanded="${open}">${txt(it.name)}</button></td>
      <td data-label="${esc(tl)}">${it.type?`<span class="tag" style="--c:${d.colors[it.type]}">${esc(it.type)}</span>`:blank}</td>
      <td data-label="Τοποθεσία"><span>${txt(it.address)}<span class="second">${esc([it.tk,it.city].filter(Boolean).join(" "))||""}</span></span></td>
      <td data-label="Γεωγρ. περιφέρεια">${txt(it.geo)}</td>
      <td data-label="Δίκτυο"><span>${txt(it.network)}${it.region?`<span class="second">${esc(it.region)}</span>`:""}</span></td>
      <td data-label="Κατάσταση">${it.status?`<span class="status ${st}">${esc(it.status)}</span>`:blank}</td>
      <td data-label="Ιδιοκτησία">${txt(it.owner)}</td>
      <td class="num" data-label="Επιφάνεια">${it.area!=null?nf.format(it.area):blank}</td>
      <td class="chev muted" aria-hidden="true">${open?"▾":"▸"}</td>
    </tr>`;
    if(!open) return row;
    const items = [
      ["Περιγραφή ακινήτου", txt(it.desc)],
      ["Email", it.emails.length ? it.emails.map(e=>`<a href="mailto:${esc(e)}">${esc(e)}</a>`).join("<br>") : blank],
      ["Διεύθυνση", txt([it.address,[it.tk,it.city].filter(Boolean).join(" ")].filter(Boolean).join(", "))],
      ["Επιφάνεια όπως καταχωρήθηκε", txt(it.areaRaw)]
    ];
    if(d.has("region")) items.push(["Περιφέρεια", txt(it.region)]);
    if(d.has("loctype")) items.push(["Τύπος τοποθεσίας", txt(it.loctype)]);
    return row + `<tr class="detail"><td colspan="${COLUMNS.length+1}"><dl class="dgrid">${items.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl></td></tr>`;
  }).join("");
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button,summary,a,input,label") || e.target;
  // close other facet menus
  document.querySelectorAll("details.facet[open]").forEach(det=>{ if(!det.contains(e.target)) det.open=false; });

  const tab = e.target.closest("[data-tab]");
  if(tab){ state.tab=tab.dataset.tab; renderAll(); return; }

  const ty = e.target.closest("[data-type]");
  if(ty){ toggle("type", ty.dataset.type); return; }

  const so = e.target.closest("[data-sort]");
  if(so){ const v=V(), k=so.dataset.sort;
    if(v.sort.key===k) v.sort.dir*=-1; else v.sort={key:k,dir:k==="area"?-1:1};
    render(); return; }

  const cl = e.target.closest("[data-clear]");
  if(cl){ delete V().sel[cl.dataset.clear]; render(); return; }

  const ch = e.target.closest("[data-chip]");
  if(ch){ const v=V(), k=ch.dataset.chip;
    if(k==="all"){ v.sel={}; v.q=""; v.amin=""; v.amax=""; v.anull=false; syncInputs(); }
    else if(k==="q"){ v.q=""; syncInputs(); }
    else if(k==="area"){ v.amin=""; v.amax=""; v.anull=false; syncInputs(); }
    else { const s=v.sel[k]; s && s.delete(ch.dataset.val); }
    render(); return; }

  const row = e.target.closest("tr.row");
  if(row && !e.target.closest("a")){
    const v=V(), id=row.dataset.id;
    v.open.has(id)?v.open.delete(id):v.open.add(id);
    render();
    const again=document.querySelector(`tr.row[data-id="${CSS.escape(id)}"] .nm`); if(again) again.focus({preventScroll:true});
  }
});
function toggle(k,x){
  const v=V(); const s=v.sel[k]||(v.sel[k]=new Set());
  s.has(x)?s.delete(x):s.add(x); render();
}
$("facets").addEventListener("change", e=>{
  const det=e.target.closest("details.facet"); if(!det) return;
  toggle(det.dataset.key, e.target.value);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") document.querySelectorAll("details.facet[open]").forEach(d=>{d.open=false; d.querySelector("summary").focus();});
});
let qt; $("q").addEventListener("input", e=>{ clearTimeout(qt); qt=setTimeout(()=>{ V().q=e.target.value.trim(); render(); },120); });
["amin","amax"].forEach(id=>$(id).addEventListener("input", e=>{ V()[id]=e.target.value; if(e.target.value) { V().anull=false; $("anull").checked=false; } render(); }));
$("anull").addEventListener("change", e=>{ const v=V(); v.anull=e.target.checked; if(v.anull){v.amin="";v.amax="";syncInputs();} render(); });
$("sortsel").addEventListener("change", e=>{ const [k,d]=e.target.value.split(":"); V().sort={key:k,dir:+d}; render(); });

/* ---------- loading a new JSON ---------- */
function banner(msg, err){
  $("banner").innerHTML = `<div class="banner ${err?"err":""}" role="status"><span>${msg}</span><button class="btn link" type="button" onclick="this.closest('.banner').remove()">Απόκρυψη</button></div>`;
}
function readFile(f){
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      load(JSON.parse(r.result), f.name);
      const d=state.data;
      banner(`Φορτώθηκε το ${esc(f.name)}: ${d.stores?d.stores.items.length+" καταστήματα":""}${d.stores&&d.facilities?" και ":""}${d.facilities?d.facilities.items.length+" εγκαταστάσεις":""}. Η αλλαγή ισχύει μέχρι να ανανεωθεί η σελίδα.`);
    }catch(err){ banner(`Δεν φορτώθηκε το ${esc(f.name)}. ${esc(err.message||"Μη έγκυρο JSON.")}`, true); }
  };
  r.onerror=()=>banner(`Δεν διαβάστηκε το ${esc(f.name)}.`, true);
  r.readAsText(f,"utf-8");
}
$("file").addEventListener("change", e=>{ readFile(e.target.files[0]); e.target.value=""; });
let dragDepth=0;
window.addEventListener("dragenter", e=>{ if([...(e.dataTransfer?.types||[])].includes("Files")){ dragDepth++; $("drop").classList.add("on"); } });
window.addEventListener("dragleave", ()=>{ if(--dragDepth<=0){ dragDepth=0; $("drop").classList.remove("on"); } });
window.addEventListener("dragover", e=>e.preventDefault());
window.addEventListener("drop", e=>{ e.preventDefault(); dragDepth=0; $("drop").classList.remove("on"); readFile(e.dataTransfer.files[0]); });

let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(D()) renderMix(); },150); });
try{ load(JSON.parse($("seed").textContent), "stores.json"); }
catch(err){ banner("Τα ενσωματωμένα δεδομένα δεν διαβάστηκαν: "+esc(err.message), true); }
})();
</script>
